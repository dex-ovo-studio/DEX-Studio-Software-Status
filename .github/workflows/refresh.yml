name: Refresh software versions
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-software-versions
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test scripts/status.test.mjs
      - run: node scripts/status.mjs --refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/status.mjs --check
      - name: Save verified software versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh published software versions'
            git push origin HEAD:main
          fi
